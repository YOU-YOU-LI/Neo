name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Show Java info
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Show Gradle wrapper properties
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "gradle-wrapper.properties:"
            sed -n '1,200p' gradle/wrapper/gradle-wrapper.properties
          else
            echo "No gradle-wrapper.properties found"
          fi

      - name: Ensure gradlew is executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ls -la ./gradlew
          else
            echo "gradlew not found in repo root"
            ls -la
            exit 1
          fi

      - name: Show Gradle version (wrapper)
        run: ./gradlew --version

      - name: Run Gradle build (capture logs)
        run: |
          ./gradlew build --no-daemon --stacktrace --info 2>&1 | tee build.log
        # keep failure behavior - step will fail if build fails

      - name: List all JAR files
        if: always()
        run: |
          echo "查找所有 .jar 文件："
          find . -name "*.jar" -type f

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: '**/build/libs/*.jar'
