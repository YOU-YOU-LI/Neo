name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Show Java info
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Show Gradle wrapper properties
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "gradle-wrapper.properties:"
            sed -n '1,200p' gradle/wrapper/gradle-wrapper.properties
          else
            echo "No gradle-wrapper.properties found"
          fi

      - name: Ensure gradlew is executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ls -la ./gradlew
          else
            echo "gradlew not found in repo root"
            ls -la
            exit 1
          fi

      - name: Show Gradle version (wrapper)
        run: ./gradlew --version || true

      - name: Print available Gradle tasks (debug)
        run: |
          ./gradlew tasks --all --no-daemon --console=plain > gradle-tasks.txt || true

      - name: Run Gradle build (capture logs)
        run: |
          ./gradlew clean build assemble jar createMinecraftArtifacts --no-daemon --stacktrace --info 2>&1 | tee build.log || true
        # do not fail this step so we always collect debug outputs

      - name: List all JAR files
        if: always()
        run: |
          echo "查找所有 .jar 文件："
          find . -name "*.jar" -type f -exec ls -l {} \; || true

      - name: Print build tree (debug)
        if: always()
        run: |
          echo "---- build directory tree ----"
          ls -la
          if [ -d build ]; then
            echo "Contents of build/ (recursive):"
            find build -maxdepth 4 -type d -print -exec ls -la {} \; || true
          else
            echo "No build directory found"
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            build.log
            gradle-tasks.txt

      - name: Upload build artifacts (JARs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            **/build/libs/*.jar
            build/moddev/**/*.jar
            **/*.jar
          if-no-files-found: warn

      - name: Upload full build folder for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-folder
          path: build/**
          if-no-files-found: warn
