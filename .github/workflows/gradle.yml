# 工作流名称
name: Java CI with Gradle

# 触发条件：当推送到 main 分支或发起 Pull Request 时运行
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 定义工作流中的任务
jobs:
  build:
    # 运行环境：使用最新的 Ubuntu
    runs-on: ubuntu-latest

    # 执行步骤
    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Java 环境 (JDK 21)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'    # 使用 Eclipse Temurin (原 AdoptOpenJDK)
        java-version: '21'         # NeoForge 要求 Java 21[reference:2]
        cache: 'gradle'            # 自动缓存 Gradle 依赖，加速构建

    # 3. 赋予 gradlew 执行权限 (Linux/macOS 环境需要)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行 Gradle 构建
    # 使用 --no-daemon 避免守护进程问题[reference:4]
    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    # 5. 上传构建产物 (生成的 JAR 文件)
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: build/libs/*.jar
